<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cây Thông Noel 3D Lung Linh - Merry Christmas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #02050e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* Video Camera ẩn phục vụ nhận diện tay */
        #webcam {
            display: none;
        }

        /* Overlay hiệu ứng lời chúc & ảnh */
        .overlay-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(10, 20, 40, 0.85);
            border: 1px solid rgba(138, 207, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 195, 255, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            color: #fff;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
            width: 340px;
        }

        .overlay-card.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .overlay-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .overlay-card h2 {
            font-size: 22px;
            color: #7de3ff;
            text-shadow: 0 0 10px #00a2ff;
            margin-bottom: 8px;
        }

        .overlay-card p {
            font-size: 14px;
            color: #e0f4ff;
            line-height: 1.5;
        }

        /* Controls nhỏ gọn góc màn hình */
        .ui-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: rgba(15, 30, 55, 0.7);
            border: 1px solid rgba(120, 200, 255, 0.5);
            color: #cceeff;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.95);
            background: rgba(0, 150, 255, 0.6);
        }

        /* Status badge cử chỉ tay */
        #gesture-status {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 5;
            background: rgba(5, 12, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #8adaff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(5px);
        }
    </style>

    <!-- Import Three.js & MediaPipe libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="webgl-container"></div>
    <video id="webcam" playsinline></video>

    <div id="gesture-status">✋ Bật Camera hoặc chạm nút để tương tác</div>

    <!-- Hộp thoại Lời Chúc & Ảnh (Khi giơ ngón cái 👍 hoặc bấm nút) -->
    <div class="overlay-card" id="wish-card">
        <img src="https://images.unsplash.com/photo-1543589077-47d51606c1bf?auto=format&fit=crop&w=600&q=80" alt="Merry Christmas">
        <h2>Merry Christmas! 🎄✨</h2>
        <p>Chúc bạn một mùa Giáng Sinh ấm áp, ngập tràn niềm vui, may mắn và hạnh phúc bên gia đình & những người thân yêu!</p>
    </div>

    <!-- Hộp thoại Gallery Ảnh (Khi mở bàn tay 🖐️ hoặc bấm nút) -->
    <div class="overlay-card" id="gallery-card">
        <img src="https://images.unsplash.com/photo-1512389142860-9c449e58a543?auto=format&fit=crop&w=600&q=80" alt="Christmas Lights">
        <h2>Kỷ Niệm Đêm Noel ❄️</h2>
        <p>Giữ trọn những khoảnh khắc đẹp nhất và lung linh nhất của mùa đông năm nay!</p>
    </div>

    <div class="ui-controls">
        <button class="btn" onclick="triggerSpiral()">🌀 Hiệu ứng Xoắn Ốc</button>
        <button class="btn" onclick="toggleWish()">👍 Lời Chúc</button>
        <button class="btn" onclick="toggleGallery()">🖐️ Ảnh Đẹp</button>
    </div>

    <script>
        // --- 1. KHỞI TẠO THREE.JS SCENE ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02050e, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 35);
        camera.lookAt(0, 12, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // --- 2. TẠO HẠT PHÁT SÁNG (PARTICLE TEXTURE) ---
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(200,240,255,0.8)');
            gradient.addColorStop(0.8, 'rgba(100,180,255,0.2)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createGlowTexture();

        // --- 3. DỰNG CÂY THÔNG 3D BẰNG 18,000 HẠT LIGHT PARTICLES ---
        const particleCount = 18000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);
        const originalY = new Float32Array(particleCount);

        const treeHeight = 24;
        const baseRadius = 10;

        for (let i = 0; i < particleCount; i++) {
            // Tỷ lệ từ gốc (0) lên đỉnh (1)
            const ratio = Math.pow(Math.random(), 1.2); 
            const y = ratio * treeHeight;
            originalY[i] = y;

            const radius = (1 - ratio) * baseRadius * (0.8 + Math.random() * 0.4);
            const angle = Math.random() * Math.PI * 2;

            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            // Phối màu Bạc Sương - Xanh Lam Light - Trắng Băng (Đúng màu ảnh mẫu)
            const color = new THREE.Color();
            const colorRand = Math.random();
            if (colorRand > 0.8) {
                color.setHSL(0.55, 0.9, 0.8); // Xanh lam sáng
            } else if (colorRand > 0.4) {
                color.setHSL(0.5, 0.3, 0.9);  // Trắng bạc
            } else {
                color.setHSL(0.6, 0.7, 0.6);  // Xanh băng giá
            }

            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;

            sizes[i] = Math.random() * 0.4 + 0.15;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const material = new THREE.PointsMaterial({
            size: 0.35,
            vertexColors: true,
            map: particleTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const treeParticles = new THREE.Points(geometry, material);
        scene.add(treeParticles);

        // --- 4. TẠO NGÔI SAO TỎA SÁNG TRÊN ĐỈNH ---
        const starGroup = new THREE.Group();
        starGroup.position.set(0, treeHeight + 0.5, 0);

        const starGeo = new THREE.OctahedronGeometry(1.2, 0);
        const starMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
        const starMesh = new THREE.Mesh(starGeo, starMat);
        starGroup.add(starMesh);

        // Hào quang ngôi sao
        const starGlowMat = new THREE.SpriteMaterial({
            map: particleTexture,
            color: 0x88e5ff,
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        const starGlow = new THREE.Sprite(starGlowMat);
        starGlow.scale.set(8, 8, 1);
        starGroup.add(starGlow);
        scene.add(starGroup);

        // --- 5. TẠO DẢI ÁNH SÁNG XOẮN ỐC (SPIRAL WAVE EFFECT) ---
        const spiralCount = 1200;
        const spiralGeo = new THREE.BufferGeometry();
        const spiralPos = new Float32Array(spiralCount * 3);
        const spiralColors = new Float32Array(spiralCount * 3);

        for (let i = 0; i < spiralCount; i++) {
            const t = i / spiralCount;
            const y = t * treeHeight;
            const angle = t * Math.PI * 14; 
            const radius = (1 - t) * (baseRadius + 0.8);

            spiralPos[i * 3] = Math.cos(angle) * radius;
            spiralPos[i * 3 + 1] = y;
            spiralPos[i * 3 + 2] = Math.sin(angle) * radius;

            const c = new THREE.Color().setHSL(0.52, 1.0, 0.7);
            spiralColors[i * 3] = c.r;
            spiralColors[i * 3 + 1] = c.g;
            spiralColors[i * 3 + 2] = c.b;
        }

        spiralGeo.setAttribute('position', new THREE.BufferAttribute(spiralPos, 3));
        spiralGeo.setAttribute('color', new THREE.BufferAttribute(spiralColors, 3));

        const spiralMat = new THREE.PointsMaterial({
            size: 0.6,
            vertexColors: true,
            map: particleTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const spiralPoints = new THREE.Points(spiralGeo, spiralMat);
        scene.add(spiralPoints);

        // --- 6. HIỆU ỨNG TUYẾT RƠI LUNG LINH ---
        const snowCount = 1500;
        const snowGeo = new THREE.BufferGeometry();
        const snowPos = new Float32Array(snowCount * 3);

        for (let i = 0; i < snowCount; i++) {
            snowPos[i * 3] = (Math.random() - 0.5) * 50;
            snowPos[i * 3 + 1] = Math.random() * 40;
            snowPos[i * 3 + 2] = (Math.random() - 0.5) * 50;
        }

        snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
        const snowMat = new THREE.PointsMaterial({
            size: 0.25,
            color: 0xffffff,
            map: particleTexture,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });

        const snowParticles = new THREE.Points(snowGeo, snowMat);
        scene.add(snowParticles);

        // --- 7. ANIMATION LOOP & XOẮN ỐC MỞ ĐẦU ---
        let spiralProgress = 0;
        let isSpiralActive = true;

        function triggerSpiral() {
            spiralProgress = 0;
            isSpiralActive = true;
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Xoay nhẹ cây thông
            treeParticles.rotation.y = elapsedTime * 0.15;
            spiralPoints.rotation.y = elapsedTime * 0.15;
            starGroup.rotation.y = -elapsedTime * 0.5;

            // Hiệu ứng dải xoắn ốc chạy từ dưới lên
            if (isSpiralActive) {
                spiralProgress += 0.012;
                if (spiralProgress > 1.2) spiralProgress = 0; // lặp lại
            }

            const spiralPositions = spiralPoints.geometry.attributes.position.array;
            for (let i = 0; i < spiralCount; i++) {
                const t = i / spiralCount;
                if (t < spiralProgress) {
                    spiralPositions[i * 3 + 1] = t * treeHeight;
                } else {
                    spiralPositions[i * 3 + 1] = -100; // Giấu hạt đi
                }
            }
            spiralPoints.geometry.attributes.position.needsUpdate = true;

            // Tuyết rơi nhẹ nhàng
            const snowPositions = snowParticles.geometry.attributes.position.array;
            for (let i = 0; i < snowCount; i++) {
                snowPositions[i * 3 + 1] -= 0.05;
                if (snowPositions[i * 3 + 1] < 0) snowPositions[i * 3 + 1] = 40;
            }
            snowParticles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }
        animate();

        // --- 8. ĐIỀU KHIỂN BẰNG CỬ CHỈ TAY (MEDIAPIPE HANDS) ---
        const videoElement = document.getElementById('webcam');
        const statusEl = document.getElementById('gesture-status');

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // Nhận diện xòe bàn tay (Open Hand)
                const isOpenHand = landmarks[8].y < landmarks[6].y && 
                                   landmarks[12].y < landmarks[10].y && 
                                   landmarks[16].y < landmarks[14].y && 
                                   landmarks[20].y < landmarks[18].y;

                // Nhận diện giơ ngón cái (Thumbs Up)
                const isThumbUp = landmarks[4].y < landmarks[3].y && 
                                  landmarks[8].y > landmarks[6].y && 
                                  landmarks[12].y > landmarks[10].y;

                if (isOpenHand) {
                    statusEl.innerText = "🖐️ Phát hiện mở bàn tay: Mở Album!";
                    showGallery();
                } else if (isThumbUp) {
                    statusEl.innerText = "👍 Phát hiện giơ ngón cái: Mở Lời Chúc!";
                    showWish();
                }
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        const cameraMediaPipe = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 480,
            height: 360
        });
        cameraMediaPipe.start().then(() => {
            statusEl.innerText = "✨ Camera sẵn sàng! Hãy thử giơ 👍 hoặc 🖐️";
        }).catch(() => {
            statusEl.innerText = "💡 Bấm các nút phía dưới để xem lời chúc/ảnh!";
        });

        // --- 9. CÁC NÚT BẤM INTERACTIVE ---
        const wishCard = document.getElementById('wish-card');
        const galleryCard = document.getElementById('gallery-card');

        function showWish() {
            wishCard.classList.add('active');
            galleryCard.classList.remove('active');
        }

        function showGallery() {
            galleryCard.classList.add('active');
            wishCard.classList.remove('active');
        }

        function toggleWish() {
            wishCard.classList.toggle('active');
            galleryCard.classList.remove('active');
        }

        function toggleGallery() {
            galleryCard.classList.toggle('active');
            wishCard.classList.remove('active');
        }

        // Đóng card khi bấm ra ngoài
        window.addEventListener('click', (e) => {
            if (!e.target.closest('.overlay-card') && !e.target.closest('.btn')) {
                wishCard.classList.remove('active');
                galleryCard.classList.remove('active');
            }
        });

        // Responsive khi thay đổi kích thước màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
